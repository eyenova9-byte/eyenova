name: Security & CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Supply Chain Audit & Security Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
      ADMIN_PIN_HASH: "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"
      TAP_SECRET_KEY: "sk_test_ci_placeholder"
      TAP_WEBHOOK_SECRET: "whsec_ci_placeholder"
      SKIPCASH_SECRET_KEY: "skipcash_secret_ci_placeholder"
      SKIPCASH_KEY_ID: "skipcash_key_ci_placeholder"
      SKIPCASH_CLIENT_ID: "skipcash_client_ci_placeholder"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Supply Chain Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Security Test Suite
        run: npx tsx scripts/security-tests/run-security-suite.ts

      - name: Verify Production Build
        run: npm run build
